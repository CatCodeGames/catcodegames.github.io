<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ru' }}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    {% seo %}

    <!-- ?v= сбрасывает кэш иконок в браузерах: увеличить при замене файлов -->
    <link rel="icon" href="{{ '/favicon.ico?v=2' | relative_url }}" sizes="48x48">
    <link rel="icon" href="{{ '/favicon-96x96.png?v=2' | relative_url }}" type="image/png" sizes="96x96">
    <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png?v=2' | relative_url }}">

    <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
</head>

<body>
    <div class="page">
        <main>
            {{ content }}
        </main>
        {% include site-footer.html %}
    </div>
</body>

</html>
